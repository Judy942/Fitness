buildscript {
    ext.kotlin_version = '1.9.10'
    ext.java_version = JavaVersion.VERSION_17
    repositories {
        google()
        mavenCentral()
    }

    dependencies {
        classpath 'com.android.tools.build:gradle:8.9.1'
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
    }

    subprojects {
        afterEvaluate { proj ->
            if (proj.plugins.hasPlugin("com.android.library")) {
                proj.android {
                    if (namespace == null || namespace.isEmpty()) {
                        namespace = proj.group?.toString() ?: "com.example.${proj.name}"
                    }
                }
            }
        }
    }
}

subprojects {
    afterEvaluate { proj ->
        if (proj.plugins.hasPlugin("com.android.library") || proj.plugins.hasPlugin("com.android.application")) {
            proj.android {
                compileOptions {
                    sourceCompatibility java_version
                    targetCompatibility java_version
                }
            }
        }
        if (proj.plugins.hasPlugin("kotlin-android")) {
            proj.tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).configureEach {
                kotlinOptions {
                    jvmTarget = java_version.toString()
                }
            }
        }
    }
}

rootProject.buildDir = '../build'
subprojects {
    project.buildDir = "${rootProject.buildDir}/${project.name}"
}
subprojects {
    project.evaluationDependsOn(':app')
}

tasks.register("clean", Delete) {
    delete rootProject.buildDir
}
